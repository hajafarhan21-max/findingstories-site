name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-verification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Vercel's Git integration owns deployment and its runtime environment.
      PRODUCTION_URL: https://finding-stories.com
      ACCEPTANCE_BASE_URL: https://finding-stories.com
      # Dedicated machine credential: it cannot create an admin session and the
      # server confines every operation to events and RSVPs marked is_test=true.
      ACCEPTANCE_TEST_SECRET: ${{ secrets.ACCEPTANCE_TEST_SECRET }}
      # Give the integration time to build/promote before polling the custom domain.
      SMOKE_INITIAL_WAIT_MS: 90000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Wait for Vercel Git deployment and verify production
        run: npm run smoke:production
      - name: Persist and verify synthetic production RSVPs
        run: npm run acceptance:production
      - name: Report workflow failure
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### ❌ Production verification failed

          Review the failed step and its diagnostics above. Vercel's Git integration is the only deployer. Production is accepted only when health and public routes pass and two isolated synthetic TEST RSVPs, their leads, activity, and exact idempotent capacity accounting are verified through the deployed transactional API.
          EOF
