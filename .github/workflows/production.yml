name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify required production secrets
        shell: bash
        run: |
          missing=()
          for name in DATABASE_URL ADMIN_PASSWORD VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if ((${#missing[@]})); then
            echo "### ❌ Missing production secrets" >> "$GITHUB_STEP_SUMMARY"
            printf -- '- `%s`\n' "${missing[@]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '### ✅ Required production secrets are configured' >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Enforce non-destructive database policy
        run: |
          if rg --ignore-case --glob '*.sql' --glob '*.js' '\b(DROP|TRUNCATE)\b|\bDELETE\s+FROM\b|database\s+reset' database api/_lib/db.js; then
            echo '### ❌ Destructive database statement detected' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '### ✅ Database safety policy passed' >> "$GITHUB_STEP_SUMMARY"
      - name: Test Neon and initialize schema safely
        run: npm run db:init
      - name: Pull Vercel production configuration
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Verify Vercel production runtime secrets
        run: |
          env_file=.vercel/.env.production.local
          missing=()
          for name in DATABASE_URL OPENAI_API_KEY ADMIN_PASSWORD SESSION_SECRET; do
            rg --quiet "^${name}=" "$env_file" || missing+=("$name")
          done
          if ((${#missing[@]})); then
            echo '### ❌ Missing Vercel production environment variables' >> "$GITHUB_STEP_SUMMARY"
            printf -- '- `%s`\n' "${missing[@]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '### ✅ Vercel production runtime secrets are configured' >> "$GITHUB_STEP_SUMMARY"
      - name: Build with Vercel production settings
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy and wait for Vercel production
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### ✅ Vercel deployment completed\n\`$url\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify production routes and APIs
        env:
          PRODUCTION_URL: ${{ steps.deploy.outputs.url }}
        run: npm run smoke:production
      - name: Report workflow failure
        if: failure()
        run: echo '### ❌ Production deployment failed
          Review the failed step above. Production is successful only when `/api/health` reports `api=ok` and `database=ok`.' >> "$GITHUB_STEP_SUMMARY"
