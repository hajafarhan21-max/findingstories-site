name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-verification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Vercel's Git integration owns deployment and its runtime environment.
      PRODUCTION_URL: https://finding-stories.com
      # Give the integration time to build/promote before polling the custom domain.
      SMOKE_INITIAL_WAIT_MS: 90000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Wait for Vercel Git deployment and verify production
        run: npm run smoke:production
      - name: Report workflow failure
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### ❌ Production verification failed

          Review the failed step and its diagnostics above. Vercel's Git integration is the only deployer; this workflow does not deploy or access production secrets. A healthy production response must report `api=ok` and `database=ok`, and both public pages must return HTML successfully.
          EOF
