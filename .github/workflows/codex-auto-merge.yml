name: Codex auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'codex/') &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for the validated Codex PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          pr=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/pulls" --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo '### ❌ No pull request was associated with the successful CI run' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          gh pr merge "$pr" --repo "$REPOSITORY" --squash --auto
          echo "### ✅ Auto-merge enabled for Codex PR #$pr" >> "$GITHUB_STEP_SUMMARY"
