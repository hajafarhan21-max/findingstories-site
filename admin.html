<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Finding Stories CRM</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><style>
:root{--gold:#d6b46a;--muted:#aaa;--line:#ffffff1c}*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Inter,sans-serif}main{width:min(1450px,94%);margin:auto;padding:44px 0}h1{font:700 40px "Playfair Display",serif;margin:0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}button,input{font:inherit;border-radius:10px;padding:11px 14px}button{border:0;background:var(--gold);font-weight:700;cursor:pointer}input{background:#ffffff10;border:1px solid var(--line);color:#fff}.login{max-width:430px;margin:14vh auto;padding:30px;border:1px solid var(--line);border-radius:22px;background:#111}.login form{display:flex;gap:10px}.login input{flex:1}.error{color:#ffb4a8;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:24px}.stat{padding:18px;background:#111;border:1px solid var(--line);border-radius:16px}.stat b{font-size:26px;color:var(--gold);display:block}.stat span{color:var(--muted);font-size:13px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:1250px;background:#0d0d0d}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}th{color:var(--gold);position:sticky;top:0;background:#151515}.summary{max-width:260px;color:#ccc;line-height:1.45}.summary small{display:block;color:#777;margin-top:5px}.processing{color:var(--gold)}.temp{font-weight:700}.Hot{color:#ff776d}.Warm{color:#f4ca64}.Cold{color:#85bffc}.hidden{display:none}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start}h1{font-size:30px}}
</style></head><body><section id="login" class="login"><h1>CRM Access</h1><p>Authorised Finding Stories team members only.</p><form id="login-form"><input name="password" type="password" placeholder="Admin password" autocomplete="current-password" required><button>Sign in</button></form><div id="login-error" class="error"></div></section><main id="crm" class="hidden"><header><div><h1>Finding Stories CRM</h1><p>AI-qualified website enquiries</p></div><button id="logout">Sign out</button></header><div id="stats" class="stats"></div><div class="table-wrap"><table><thead><tr><th>Captured</th><th>Client</th><th>Contact</th><th>Source</th><th>Budget</th><th>Requirement</th><th>Score</th><th>Temperature</th><th>Qualification</th><th>Next action</th><th>Follow-up</th></tr></thead><tbody id="leads"></tbody></table></div></main><script src="/public/admin.js" defer></script></body></html>
