<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Finding Stories CRM</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><style>
:root{--gold:#d6b46a;--muted:#aaa;--line:#ffffff1c;--panel:#111}*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Inter,sans-serif}main{width:min(1450px,94%);margin:auto;padding:44px 0}h1{font:700 40px "Playfair Display",serif;margin:0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}button,input,select,textarea{font:inherit;border-radius:10px;padding:11px 14px}button,.whatsapp{border:0;background:var(--gold);color:#080808;font-weight:700;cursor:pointer;text-decoration:none}input,select,textarea{background:#ffffff10;border:1px solid var(--line);color:#fff}option{background:#151515}.login{max-width:430px;margin:14vh auto;padding:30px;border:1px solid var(--line);border-radius:22px;background:#111}.login form{display:flex;gap:10px}.login input{flex:1}.error,.save-message{color:#ffb4a8;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}.stat{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.stat b{font-size:26px;color:var(--gold);display:block}.stat span,small,.date{color:var(--muted);font-size:12px}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:18px}.lead{background:#0d0d0d;border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}.lead.overdue{border-left:4px solid #ff776d}.lead-row{display:grid;grid-template-columns:2.3fr .7fr 1fr 1fr 1.25fr;gap:18px;align-items:center;padding:18px}.lead h2{font-size:18px;margin:4px 0}.score{font-size:22px;margin-right:8px}.temp{font-weight:700}.Hot,.due{color:#ff776d}.Warm{color:#f4ca64}.Cold{color:#85bffc}.pill{display:block;text-transform:capitalize}.follow-up small,.lead-row div>small{display:block;margin-top:5px}.row-actions{display:flex;gap:8px}.detail{border-top:1px solid var(--line);padding:20px;background:#131313}.detail-copy{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.detail-copy p{color:#ccc;line-height:1.5}.detail-copy b{display:block;color:var(--gold);margin-bottom:4px}.edit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.edit-grid label{font-size:12px;color:var(--muted)}.edit-grid input,.edit-grid select,.edit-grid textarea{display:block;width:100%;margin-top:5px}.wide{grid-column:span 3}.actions{display:flex;gap:8px;align-items:center;margin-top:14px}.secondary{background:#ddd}.danger{background:#a9403a;color:#fff}.hidden{display:none}.empty{text-align:center;color:var(--muted);padding:40px}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:1fr 1fr}.lead-row{grid-template-columns:1fr 1fr}.detail-copy,.edit-grid{grid-template-columns:1fr}.wide{grid-column:auto}}@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start}h1{font-size:30px}.filters,.lead-row{grid-template-columns:1fr}}
</style></head><body><section id="login" class="login"><h1>CRM Access</h1><p>Authorised Finding Stories team members only.</p><form id="login-form"><input name="password" type="password" placeholder="Admin password" autocomplete="current-password" required><button>Sign in</button></form><div id="login-error" class="error"></div></section><main id="crm" class="hidden"><header><div><h1>Finding Stories CRM</h1><p>AI-qualified website enquiries · Dubai time</p></div><button id="logout">Sign out</button></header><div id="stats" class="stats"></div><section class="filters" aria-label="Lead filters"><input id="search" type="search" placeholder="Search client, phone or email"><select id="temperature"><option value="">All temperatures</option><option>Hot</option><option>Warm</option><option>Cold</option></select><select id="status-filter"><option value="">All statuses</option><option value="new">New</option><option value="contacted">Contacted</option><option value="qualified">Qualified</option><option value="meeting_scheduled">Meeting scheduled</option><option value="site_visit_scheduled">Site visit scheduled</option><option value="booked">Booked</option><option value="lost">Lost</option></select><select id="agent"><option value="">All agents</option></select><select id="sort"><option value="newest">Newest</option><option value="score">Score</option><option value="follow_up">Follow-up date</option></select></section><section id="leads"></section></main><script src="/public/admin.js" type="module"></script></body></html>
